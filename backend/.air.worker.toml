# Hot reload cho worker. Chạy: cd backend && air -c .air.worker.toml
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  entrypoint = ["./tmp/worker"]
  include_ext = ["go"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_dir = ["tmp", "migrations", "cmd/api"]
  delay = 500
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
